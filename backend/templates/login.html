<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NutriScan AI - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #e8f5e9,
        #f5fff6
    );

}

.container {

    width: 90%;

    max-width: 430px;

}

.card {

    background: white;

    padding: 40px;

    border-radius: 24px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.12);

    text-align: center;

}

.logo {

    font-size: 32px;

    font-weight: bold;

    color: #238636;

    margin-bottom: 8px;

}

.subtitle {

    color: #777;

    margin-bottom: 30px;

}

input {

    width: 100%;

    padding: 14px;

    margin: 9px 0;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

}

input:focus {

    outline: none;

    border-color: #238636;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #238636;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    background: #176b29;

}

.message {

    padding: 10px;

    margin-bottom: 15px;

    border-radius: 8px;

    font-size: 14px;

}

.error {

    background: #ffeaea;

    color: #c62828;

}

.success {

    background: #e8f5e9;

    color: #238636;

}

.register {

    margin-top: 22px;

    color: #666;

}

.register a {

    color: #238636;

    font-weight: bold;

    text-decoration: none;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
🥗 NutriScan AI
</div>

<div class="subtitle">
Welcome back!
</div>


{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="message {{ category }}">
{{ message }}
</div>

{% endfor %}

{% endif %}

{% endwith %}


<form method="POST">

<input
    type="email"
    name="email"
    placeholder="Email address"
    required
>

<input
    type="password"
    name="password"
    placeholder="Password"
    required
>

<button type="submit">
🔐 Login
</button>

</form>


<div class="register">

Don't have an account?

<a href="{{ url_for('register') }}">
Create Account
</a>

</div>

</div>

</div>

</body>

</html>
